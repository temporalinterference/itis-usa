name: Deploy Hugo site
# Dual-target deployment: rsync (SSH) or GitHub Pages
#
# Auto-detection:
#   - Set the SSH_HOST repository secret to enable rsync deployment
#   - Leave SSH_HOST unset to deploy via GitHub Pages
#
# Required secrets for rsync target:
#   SSH_KEY  — ed25519 private key
#   SSH_USER — remote username
#   SSH_HOST — remote hostname (also serves as the toggle)
#   SSH_PORT — SSH port
#   SITE_URL — site base URL (e.g. https://example.com)
#
# For GitHub Pages target:
#   SITE_URL — optional (falls back to configure-pages output)
#
# Server-side rsync setup:
#   The remote uses rrsync (restricted rsync) to limit SSH access to
#   public_html/ with no shell login. Both push and pull are allowed
#   so the workflow can read back the branch directory listing.
#
#   1. Install rrsync (ships with rsync):
#        # Debian/Ubuntu — already at /usr/bin/rrsync
#        # RHEL/CentOS   — cp /usr/share/doc/rsync/support/rrsync /usr/local/bin/
#        # verify:
#        which rrsync
#
#   2. Create the deploy user and web root:
#        sudo useradd -m -s /usr/sbin/nologin deployuser
#        sudo mkdir -p /home/deployuser/public_html
#        sudo chown deployuser:deployuser /home/deployuser/public_html
#
#   3. Add the deploy key to ~deployuser/.ssh/authorized_keys:
#        restrict,command="rrsync /home/deployuser/public_html" ssh-ed25519 AAAA...
#
#      "restrict" disables port-forwarding, agent-forwarding, pty, etc.
#      rrsync confines all rsync operations to the given directory.
#      Rsync paths in this workflow are relative to the rrsync root (e.g. "."
#      maps to public_html/).

on:
  push:
    branches:
      - '**'  # Trigger on all branch pushes
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  pull-requests: write  # Needed for PR comments

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-pr:
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr || 'false' }}
    steps:
      - name: Check if branch has PR
        id: check
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Use the GitHub API directly instead of the CLI to avoid needing git checkout
          PR=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/pulls?head=${REPO%/*}:$BRANCH&state=open")

          if [ "$(echo "$PR" | jq '. | length')" -gt 0 ]; then
            echo "has_pr=true" >> $GITHUB_OUTPUT
          else
            echo "has_pr=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-pr
    # Skip if this is a push to a branch that has an active PR
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || needs.check-pr.outputs.has_pr != 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.deploy-target.outputs.target }}
    env:
      DART_SASS_VERSION: 1.93.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Get all history for proper branch handling
          # For PRs from forks, we need to specify the ref explicitly
          ref: ${{ github.event.pull_request.head.sha }}
          # For fork PRs, we need to fetch from the fork
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install tools with mise
        uses: jdx/mise-action@v3
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/dart-sass" >> "${GITHUB_PATH}"

      - name: Initialize Hugo modules and theme
        run: |
          # Get Hugo modules
          hugo mod get -u

          # Initialize theme UIKit dependency using the theme's init script
          bash "$(hugo config mounts | jq -rs '.[] | select(.path | contains("z43-cards-theme")) | .dir')/init-theme.sh"

      # For fork PRs, verify the contents are safe
      - name: Verify fork PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Running security checks for fork PR..."

          echo "1. Checking for suspicious files..."
          SUSPICIOUS_FILES=$(find . -type f -name "*.php" -o -name "*.cgi" -o -name "*.sh" -o -name "*.exe" -o -name "*.dll" || true)
          if [ ! -z "$SUSPICIOUS_FILES" ]; then
            echo "Error: Found potentially suspicious files:"
            echo "$SUSPICIOUS_FILES"
            exit 1
          fi

          echo "2. Checking for changes outside allowed paths..."
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          # Adjust these patterns based on your repository structure
          ALLOWED_PATTERNS="^content/|^static/|^layouts/|^data/|^i18n/|^assets/"
          SUSPICIOUS_PATHS=$(echo "$CHANGED_FILES" | grep -vE "$ALLOWED_PATTERNS" || true)
          if [ ! -z "$SUSPICIOUS_PATHS" ]; then
            echo "Error: Changes detected outside allowed directories:"
            echo "$SUSPICIOUS_PATHS"
            exit 1
          fi

          echo "3. Checking repository size..."
          TOTAL_SIZE=$(du -sm . | cut -f1)
          if [ $TOTAL_SIZE -gt 500 ]; then
            echo "Error: Repository size exceeds 500MB limit"
            exit 1
          fi

          echo "4. Validating Hugo configuration..."
          if ! hugo config; then
            echo "Error: Invalid Hugo configuration"
            exit 1
          fi

          echo "5. Checking for suspicious config changes..."
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q 'config\.'; then
            echo "Warning: Configuration file changes detected"
            CONFIG_CHANGES=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- config.*)
            echo "$CONFIG_CHANGES"

            # Check for suspicious patterns
            if echo "$CONFIG_CHANGES" | grep -iE "curl|wget|http|exec|eval|system|rm|remove|delete"; then
              echo "Error: Suspicious patterns found in config changes"
              exit 1
            fi
          fi

          echo "6. Checking for large files..."
          LARGE_FILES=$(find . -type f -size +10M)
          if [ ! -z "$LARGE_FILES" ]; then
            echo "Error: Found files larger than 10MB:"
            echo "$LARGE_FILES"
            exit 1
          fi

          echo "7. Checking for binary files..."
          BINARY_FILES=$(find . -type f -exec file {} \; | grep "executable" || true)
          if [ ! -z "$BINARY_FILES" ]; then
            echo "Error: Found binary executable files:"
            echo "$BINARY_FILES"
            exit 1
          fi

          echo "8. Validating content structure..."
          # Add checks specific to your Hugo site structure
          if [ ! -d "content" ]; then
            echo "Error: Missing content directory"
            exit 1
          fi

          echo "Security checks passed!"

      - name: Determine deploy target
        id: deploy-target
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "target=rsync" >> $GITHUB_OUTPUT
            echo "base_url=${SITE_URL}" >> $GITHUB_OUTPUT
          else
            echo "target=pages" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.deploy-target.outputs.target == 'rsync'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Setup Pages
        id: pages
        if: steps.deploy-target.outputs.target == 'pages'
        uses: actions/configure-pages@v5

      - name: Download previous site
        if: steps.deploy-target.outputs.target == 'pages'
        id: download
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: deploy-hugo.yaml
          name: github-pages
          path: current-site
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Prepare site directory
        if: steps.deploy-target.outputs.target == 'pages'
        run: |
          set -x
          mkdir -p current-site

          if [ -f current-site/artifact.tar ]; then
            tar xf current-site/artifact.tar -C current-site
            rm current-site/artifact.tar
            echo "Extracted site from artifact"
          elif [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # If no artifact and not a push to main branch, download from live site
            echo "No artifact found, downloading from live site: ${{ steps.pages.outputs.base_url }}"

            # Use wget to mirror the live site
            # Include both the main index and previews.html to discover all branch previews
            # Must use --execute robots=off because robots.txt blocks /branch-* paths
            wget --recursive \
                 --level=inf \
                 --no-parent \
                 --no-host-directories \
                 --quiet \
                 --directory-prefix=current-site \
                 --page-requisites \
                 --execute robots=off \
                 --tries=3 \
                 --timeout=30 \
                 "${{ steps.pages.outputs.base_url }}/" \
                 "${{ steps.pages.outputs.base_url }}/previews.html" || true
            SUBDIR=$(echo "${{ steps.pages.outputs.base_url }}" | perl -pe 's{^https?://[^/]+/?}{}')
            if [ ! -z "${SUBDIR}" ]; then
              mv "current-site/${SUBDIR}" current-site-new && rm -rf current-site && mv current-site-new current-site
            fi
            # Validate download was successful
            BRANCH_COUNT=$(find current-site -maxdepth 1 -type d -name "branch-*" | wc -l)
            if [ ! -f current-site/index.html ] && [ "$BRANCH_COUNT" -eq 0 ]; then
              echo "Error: Failed to download existing site - no index.html or branch directories found"
              exit 1
            fi

            echo "Successfully downloaded existing site (found index.html or $BRANCH_COUNT branch directories)"
          fi

      - name: Build with Hugo (rsync)
        if: steps.deploy-target.outputs.target == 'rsync'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # Determine branch name based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          if [ "$BRANCH" = "main" ]; then
            hugo --minify --baseURL "${SITE_URL}/"
          else
            hugo --minify --baseURL "${SITE_URL}/branch-${BRANCH}/"
          fi

      - name: Build with Hugo (pages)
        if: steps.deploy-target.outputs.target == 'pages'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # Determine branch name based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          if [ "$BRANCH" = "main" ]; then
            # Main branch - save branch directories first
            mkdir -p temp-dirs
            mv current-site/branch-* temp-dirs/ 2>/dev/null || true

            # Build main site
            hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
            rm -rf current-site/*
            cp -r public/* current-site/

            # Restore branch directories
            mv temp-dirs/* current-site/ 2>/dev/null || true
            rm -rf temp-dirs
          else
            # Branch build
            hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/branch-${BRANCH}/"
            mkdir -p current-site/branch-${BRANCH}
            rm -rf current-site/branch-${BRANCH}/*
            cp -r public/* current-site/branch-${BRANCH}/
          fi

      - name: Deploy via rsync
        if: steps.deploy-target.outputs.target == 'rsync'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # Determine branch name based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT}"

          if [ "$BRANCH" = "main" ]; then
            rsync -avz --delete \
              --exclude='branch-*' \
              --exclude='previews.html' \
              --exclude='robots.txt' \
              -e "$SSH_CMD" \
              public/ "${SSH_USER}@${SSH_HOST}:."
          else
            rsync -avz --delete \
              -e "$SSH_CMD" \
              public/ "${SSH_USER}@${SSH_HOST}:branch-${BRANCH}/"
          fi

      - name: Update previews and robots (rsync)
        if: steps.deploy-target.outputs.target == 'rsync'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT}"

          # Pull branch-* directory listing from remote
          mkdir -p remote-branches
          rsync -avz \
            --include='branch-*/' \
            --exclude='*' \
            -e "$SSH_CMD" \
            "${SSH_USER}@${SSH_HOST}:." remote-branches/

          # Generate previews.html locally
          cat > previews.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Branch Previews</title>
              <meta name="robots" content="noindex,nofollow">
              <meta name="googlebot" content="noindex,nofollow">
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
                .preview-list { list-style: none; padding: 0; }
                .preview-list li { margin: 10px 0; padding: 10px; border: 1px solid #eee; border-radius: 4px; }
                .preview-type { font-weight: bold; margin-right: 10px; }
                a { color: #0366d6; text-decoration: none; }
                a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
          <h1>Branch Previews</h1>
          <ul class="preview-list">
          HTMLEOF

          for branch_dir in remote-branches/branch-*/; do
            if [ -d "$branch_dir" ]; then
              branch_name=$(basename "$branch_dir" | sed 's/branch-//')
              echo "<li><span class='preview-type'>Branch:</span><a href='branch-${branch_name}/'>${branch_name}</a></li>" >> previews.html
            fi
          done

          cat >> previews.html << HTMLEOF
          </ul>
          <p>Last updated: $(date)</p>
          </body></html>
          HTMLEOF

          # Generate robots.txt locally
          cat > robots.txt << 'ROBOTSEOF'
          User-agent: *
          Disallow: /branch-
          ROBOTSEOF

          # Push both files to remote
          rsync -avz \
            -e "$SSH_CMD" \
            previews.html robots.txt "${SSH_USER}@${SSH_HOST}:."

      - name: Generate preview index (pages)
        if: steps.deploy-target.outputs.target == 'pages'
        run: |
          cat > current-site/previews.html << 'EOL'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Branch Previews</title>
              <meta name="robots" content="noindex,nofollow">
              <meta name="googlebot" content="noindex,nofollow">
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
                .preview-list { list-style: none; padding: 0; }
                .preview-list li { margin: 10px 0; padding: 10px; border: 1px solid #eee; border-radius: 4px; }
                .preview-type { font-weight: bold; margin-right: 10px; }
                a { color: #0366d6; text-decoration: none; }
                a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
          <h1>Branch Previews</h1>
          <ul class="preview-list">
          EOL

          for branch in current-site/branch-*/; do
            if [ -d "$branch" ]; then
              branch_name=$(basename "$branch" | sed 's/branch-//')
              echo "<li><span class='preview-type'>Branch:</span><a href='branch-${branch_name}/'>${branch_name}</a></li>" >> current-site/previews.html
            fi
          done

          cat >> current-site/previews.html << EOL
          </ul>
          <p>Last updated: $(date)</p>
          </body></html>
          EOL

      - name: Add robots.txt (pages)
        if: steps.deploy-target.outputs.target == 'pages'
        run: |
          cat > current-site/robots.txt << 'EOL'
          User-agent: *
          Disallow: /branch-
          EOL

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Branch preview deployed!

            You can view your changes at: ${{ steps.deploy-target.outputs.base_url || steps.pages.outputs.base_url }}/branch-${{ github.head_ref }}/

            View all branch previews at: ${{ steps.deploy-target.outputs.base_url || steps.pages.outputs.base_url }}/previews.html

            ${{ github.event.pull_request.head.repo.full_name != github.repository && '⚠️ Note: This PR is from a fork. Additional security checks were performed.' || '' }}

      - name: Upload artifact (pages)
        if: steps.deploy-target.outputs.target == 'pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./current-site
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.deploy_target == 'pages' && (github.event_name == 'push' || github.event_name == 'pull_request')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
